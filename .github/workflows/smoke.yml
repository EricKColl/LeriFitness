name: Comprobación

# Comprueba la app publicada y la nube de verdad (scripts/smoke/production.ts): web, cabeceras,
# RLS, sesión, sincronización, asistente en la nube y borrado de cuenta con un usuario temporal
# que se elimina al final. Se ejecuta tras cada despliegue, cada lunes y a mano.

on:
  workflow_run:
    workflows: [Supabase, Despliegue]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['scripts/smoke/**', '.github/workflows/smoke.yml', 'supabase/**']

concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tras un despliegue, solo si este terminó bien.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      # Dirección publicada (Cloudflare añadió un sufijo porque «forja» ya existía).
      APP_URL: ${{ vars.APP_URL || 'https://forja-13u.pages.dev' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      RAW_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # La clave de servidor no se guarda en ningún sitio: se pide en cada ejecución a la API
      # de gestión de Supabase con el token de acceso, y se oculta en los registros.
      - name: Obtener la clave de servidor de Supabase
        if: env.RAW_ACCESS_TOKEN != '' && env.RAW_PROJECT_REF != ''
        run: |
          token="$(printf '%s' "$RAW_ACCESS_TOKEN" | tr -d '[:space:]')"
          ref="$(printf '%s' "$RAW_PROJECT_REF" | tr -d '[:space:]')"
          keys="$(curl -fsS -H "Authorization: Bearer $token" \
            "https://api.supabase.com/v1/projects/$ref/api-keys?reveal=true")"
          service="$(printf '%s' "$keys" | jq -r '[.[] | select(.name == "service_role" or .type == "secret")][0].api_key // empty')"
          if [ -z "$service" ]; then
            echo "::error::No se pudo obtener la clave de servidor de Supabase."
            exit 1
          fi
          echo "::add-mask::$service"
          echo "SUPABASE_SERVICE_KEY=$service" >> "$GITHUB_ENV"
      - name: Comprobar producción
        run: npx tsx scripts/smoke/production.ts
