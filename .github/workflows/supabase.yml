name: Supabase

# Aplica las migraciones de la base de datos y publica las Edge Functions de la nube opcional
# (cuentas, sincronización y asistente en la nube). Necesita tres secretos del repositorio:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF y SUPABASE_DB_PASSWORD, y opcionalmente
# GEMINI_API_KEY para el asistente en la nube (ver README).
# Sin ellos, el workflow se omite sin fallar.

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migraciones y funciones
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAW_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      RAW_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RAW_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RAW_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Comprobar secretos
        id: secrets
        run: |
          if [ -z "$RAW_ACCESS_TOKEN" ] || [ -z "$RAW_PROJECT_REF" ] || [ -z "$RAW_DB_PASSWORD" ]; then
            echo "::notice::Faltan los secretos de Supabase: se omite el despliegue."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Al copiar y pegar es fácil que se cuele un espacio o un salto de línea: se quitan y se
      # comprueba el formato para dar un error claro si el valor no es el esperado.
      - name: Limpiar y validar los secretos
        if: steps.secrets.outputs.ready == 'true'
        run: |
          token="$(printf '%s' "$RAW_ACCESS_TOKEN" | tr -d '[:space:]')"
          ref="$(printf '%s' "$RAW_PROJECT_REF" | tr -d '[:space:]')"
          password="$(printf '%s' "$RAW_DB_PASSWORD" | tr -d '\r\n')"
          gemini="$(printf '%s' "$RAW_GEMINI_API_KEY" | tr -d '[:space:]')"
          for value in "$token" "$password" "$gemini"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          case "$token" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN no es un token de acceso: debe empezar por sbp_ (se crea en supabase.com/dashboard/account/tokens)."; exit 1 ;;
          esac
          if ! printf '%s' "$ref" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::SUPABASE_PROJECT_REF debe ser el identificador de 20 letras que aparece en la URL del proyecto (supabase.com/dashboard/project/…)."
            exit 1
          fi
          {
            echo "SUPABASE_ACCESS_TOKEN=$token"
            echo "SUPABASE_PROJECT_REF=$ref"
            echo "SUPABASE_DB_PASSWORD=$password"
            echo "GEMINI_API_KEY=$gemini"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest
      - name: Vincular el proyecto
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Guardar la clave de Gemini como secreto de las funciones
        if: steps.secrets.outputs.ready == 'true' && env.GEMINI_API_KEY != ''
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY"
      - name: Publicar funciones
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
